<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Repair Lab</title>
    <meta
      name="description"
      content="Browser-based audio repair toolkit for noise removal, vocal isolation, and podcast/music cleanup."
    />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101417;
        color: #eef2f0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(780px, calc(100vw - 40px));
        padding: 48px 0;
      }

      a {
        color: #79d7c6;
      }

      .panel {
        border: 1px solid #34413f;
        border-radius: 8px;
        padding: 32px;
        background: #151b1e;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Audio Repair Lab</h1>
        <p>
          Initial GitHub Pages scaffold is live. The full client-side audio
          repair workbench is being built next.
        </p>
        <p>
          Repository:
          <a href="https://github.com/baditaflorin/audio-repair-lab"
            >https://github.com/baditaflorin/audio-repair-lab</a
          >
        </p>
        <p>
          Support:
          <a href="https://www.paypal.com/paypalme/florinbadita"
            >https://www.paypal.com/paypalme/florinbadita</a
          >
        </p>
      </section>
    </main>
  </body>
</html>
